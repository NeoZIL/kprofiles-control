<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kprofiles Control</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#14171c; --muted:#5b6470; --line:#dde1e6;
  --accent:#2563eb; --accent-soft:#e6eefc; --accent-text:#ffffff;
  --ok:#16794a; --err:#b42318; color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1216; --card:#181c22; --text:#e8ebef; --muted:#9aa4b0; --line:#2a313a;
    --accent:#5b8def; --accent-soft:#1c2a45; --accent-text:#0b0f14;
    --ok:#4cc38a; --err:#f2837a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.35rem;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 14px;margin-bottom:14px}
.card h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:6px 0}
.row .k{color:var(--muted)}
.badge{padding:2px 10px;border-radius:999px;background:var(--accent-soft);
  font-weight:600;font-size:.9rem}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;
  background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;cursor:pointer}
.opt .t{font-weight:600;display:block}
.opt .d{color:var(--muted);font-size:.86rem;display:block;margin-top:1px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt:active{transform:scale(.99)}
.opt:disabled{opacity:.6}
.sw{display:flex;align-items:flex-start;gap:12px;padding:8px 0}
.sw + .sw{border-top:1px solid var(--line)}
.sw .txt{flex:1}
.sw .t{font-weight:600;display:block}
.sw .d{color:var(--muted);font-size:.86rem;display:block}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;
  border-radius:999px;background:var(--line);position:relative;margin:2px 0 0;
  cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
  border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
.sw input:disabled{opacity:.6}
#msg{min-height:1.4em;font-size:.9rem;margin:2px 2px 10px}
#msg.ok{color:var(--ok)} #msg.err{color:var(--err)}
.note{color:var(--muted);font-size:.82rem;margin:0 2px}
</style>
</head>
<body>
<main>
  <h1>Kprofiles Control</h1>
  <p class="sub">Choose a kernel profile and the screen-off auto switch.</p>

  <section class="card" aria-label="Current state">
    <h2>Right now</h2>
    <div class="row"><span class="k">Profile</span><span class="badge" id="sMode">…</span></div>
    <div class="row"><span class="k">Auto switch (screen off)</span><span class="badge" id="sAuto">…</span></div>
    <div class="row"><span class="k">Keeps choices after reboot</span><span class="badge" id="sPersist">…</span></div>
  </section>

  <section class="card" aria-label="Profile">
    <h2>Profile</h2>
    <div class="opts" role="radiogroup" aria-label="Kprofiles mode" id="opts">
      <button class="opt" role="radio" aria-checked="false" data-mode="0">
        <span class="t">Off</span>
        <span class="d">Kprofiles is disabled. Kernel code that reads it ignores profiles.</span>
      </button>
      <button class="opt" role="radio" aria-checked="false" data-mode="1">
        <span class="t">Battery</span>
        <span class="d">Asks the kernel to skip short CPU and memory boosts.</span>
      </button>
      <button class="opt" role="radio" aria-checked="false" data-mode="2">
        <span class="t">Balanced</span>
        <span class="d">Allows short boosts when you open apps.</span>
      </button>
      <button class="opt" role="radio" aria-checked="false" data-mode="3">
        <span class="t">Performance</span>
        <span class="d">Allows the longest boosts. Uses more battery.</span>
      </button>
    </div>
  </section>

  <section class="card" aria-label="Options">
    <h2>Options</h2>
    <label class="sw">
      <span class="txt">
        <span class="t">Auto battery mode when screen is off</span>
        <span class="d">The kernel switches to battery with the screen off and restores your profile on wake.</span>
      </span>
      <input type="checkbox" role="switch" id="swAuto">
    </label>
    <label class="sw">
      <span class="txt">
        <span class="t">Remember my choices after reboot</span>
        <span class="d">Turn this off and everything returns to the kernel default at the next boot.</span>
      </span>
      <input type="checkbox" role="switch" id="swPersist">
    </label>
  </section>

  <div id="msg" role="status" aria-live="polite"></div>
  <p class="note">How much a profile changes depends on which parts of the kernel read it. Test one change at a time.</p>
</main>

<script>
(function () {
  "use strict";
  var KP = "sh /data/adb/modules/kprofiles_ui/kp.sh";
  var NAMES = { "0": "Off", "1": "Battery", "2": "Balanced", "3": "Performance" };
  var busy = false;

  function $(id) { return document.getElementById(id); }

  function setMsg(text, kind) {
    var m = $("msg");
    m.textContent = text || "";
    m.className = kind || "";
  }

  function run(args) {
    return new Promise(function (resolve) {
      if (typeof ksu === "undefined" || !ksu.exec) {
        resolve({ errno: -1, stdout: "", stderr: "Open this page from the KernelSU-Next manager (Modules, then WebUI)." });
        return;
      }
      var cb = "kpcb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
      window[cb] = function (errno, stdout, stderr) {
        delete window[cb];
        resolve({ errno: errno, stdout: stdout || "", stderr: stderr || "" });
      };
      try {
        ksu.exec(KP + " " + args, "{}", cb);
      } catch (e) {
        delete window[cb];
        resolve({ errno: -1, stdout: "", stderr: String(e) });
      }
    });
  }

  function parse(out) {
    var m = /mode=(\S+) auto=(\S+) persist=(\S+)/.exec(out);
    return m ? { mode: m[1], auto: m[2], persist: m[3] } : null;
  }

  function lockUI(on) {
    busy = on;
    var els = document.querySelectorAll(".opt, .sw input");
    for (var i = 0; i < els.length; i++) els[i].disabled = on;
  }

  function render(s) {
    $("sMode").textContent = NAMES[s.mode] || "Unknown";
    $("sAuto").textContent = s.auto === "Y" ? "On" : (s.auto === "N" ? "Off" : "Unknown");
    $("sPersist").textContent = s.persist === "1" ? "Yes" : "No";
    var opts = document.querySelectorAll(".opt");
    for (var i = 0; i < opts.length; i++) {
      opts[i].setAttribute("aria-checked", opts[i].getAttribute("data-mode") === s.mode ? "true" : "false");
    }
    $("swAuto").checked = s.auto === "Y";
    $("swPersist").checked = s.persist === "1";
  }

  function refresh(quiet) {
    return run("status").then(function (r) {
      var s = parse(r.stdout);
      if (r.errno !== 0 || !s) {
        setMsg((r.stderr || r.stdout || "Could not read the kernel state.").trim(), "err");
        return;
      }
      if (s.mode === "?" || s.auto === "?") {
        setMsg("Kprofiles was not found on this kernel.", "err");
      } else if (!quiet) {
        setMsg("", "");
      }
      render(s);
    });
  }

  function act(args, okText) {
    if (busy) return;
    lockUI(true);
    setMsg("Working…", "");
    run(args).then(function (r) {
      var failed = r.errno !== 0 || /^error:/m.test(r.stdout);
      if (failed) {
        setMsg((r.stdout || r.stderr || "That did not work.").trim(), "err");
      } else {
        setMsg(okText, "ok");
      }
      return refresh(true);
    }).then(function () { lockUI(false); });
  }

  document.getElementById("opts").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".opt") : null;
    if (!b) return;
    var m = b.getAttribute("data-mode");
    act("mode " + m, "Profile set to " + NAMES[m] + ".");
  });
  $("swAuto").addEventListener("change", function () {
    var on = $("swAuto").checked;
    act("auto " + (on ? "Y" : "N"), "Auto switch turned " + (on ? "on" : "off") + ".");
  });
  $("swPersist").addEventListener("change", function () {
    var on = $("swPersist").checked;
    act("persist " + (on ? "1" : "0"), on ? "Your choices will be kept after reboot." : "Choices will not be kept after reboot.");
  });

  refresh(false);
})();
</script>
</body>
</html>
