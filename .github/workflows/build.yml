name: build module

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Releases are published one at a time, so a second tag cannot promote itself while the first is
    # still being checked. Other runs (branches, pull requests) are not held up by this.
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/v') && 'kprofiles-release' || format('build-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are needed to read the versionCode of the current latest release

      - name: Install test shells and ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mksh busybox-static shellcheck

      - name: ShellCheck
        run: shellcheck -s sh -S warning -e SC1090,SC2154,SC2034 module/*.sh tests/*.sh build.sh release.sh

      - name: WebUI unit tests
        run: node tests/webui-test.js module/webroot/index.html
      - name: WebUI DOM regression tests
        run: node tests/webui-dom-test.js module/webroot/index.html

      # Each suite is its own step with its own time limit, so a hang is reported at the suite that hung
      # (and ends there) instead of holding the whole job until the job limit.
      - name: dash - kp tests
        timeout-minutes: 5
        run: sh tests/kp-test.sh
      - name: dash - controller source tests
        timeout-minutes: 5
        run: sh tests/control-test.sh
      - name: dash - tune tests
        timeout-minutes: 20
        run: sh tests/tune-test.sh
      - name: dash - monitor tests
        timeout-minutes: 5
        run: sh tests/monitor-test.sh
      - name: dash - build tests
        timeout-minutes: 5
        run: sh tests/build-test.sh
      - name: dash - release tests
        timeout-minutes: 10
        run: sh tests/release-test.sh
      - name: mksh shim (the shell Android uses)
        run: |
          mkdir -p "$RUNNER_TEMP/shim-mksh"
          ln -sf "$(command -v mksh)" "$RUNNER_TEMP/shim-mksh/sh"
      - name: mksh - kp tests
        timeout-minutes: 5
        run: PATH="$RUNNER_TEMP/shim-mksh:$PATH" mksh tests/kp-test.sh
      - name: mksh - controller source tests
        timeout-minutes: 5
        run: PATH="$RUNNER_TEMP/shim-mksh:$PATH" mksh tests/control-test.sh
      - name: mksh - tune tests
        timeout-minutes: 20
        run: PATH="$RUNNER_TEMP/shim-mksh:$PATH" mksh tests/tune-test.sh
      - name: mksh - monitor tests
        timeout-minutes: 5
        run: PATH="$RUNNER_TEMP/shim-mksh:$PATH" mksh tests/monitor-test.sh
      - name: mksh - build tests
        timeout-minutes: 5
        run: PATH="$RUNNER_TEMP/shim-mksh:$PATH" mksh tests/build-test.sh
      - name: mksh - release tests
        timeout-minutes: 10
        run: PATH="$RUNNER_TEMP/shim-mksh:$PATH" mksh tests/release-test.sh
      - name: busybox ash shim
        run: |
          mkdir -p "$RUNNER_TEMP/shim-bb"
          ln -sf "$(command -v busybox)" "$RUNNER_TEMP/shim-bb/sh"
      - name: busybox ash - kp tests
        timeout-minutes: 5
        run: PATH="$RUNNER_TEMP/shim-bb:$PATH" busybox sh tests/kp-test.sh
      - name: busybox ash - controller source tests
        timeout-minutes: 5
        run: PATH="$RUNNER_TEMP/shim-bb:$PATH" busybox sh tests/control-test.sh
      - name: busybox ash - tune tests
        timeout-minutes: 20
        run: PATH="$RUNNER_TEMP/shim-bb:$PATH" busybox sh tests/tune-test.sh
      - name: busybox ash - monitor tests
        timeout-minutes: 5
        run: PATH="$RUNNER_TEMP/shim-bb:$PATH" busybox sh tests/monitor-test.sh
      - name: busybox ash - build tests
        timeout-minutes: 5
        run: PATH="$RUNNER_TEMP/shim-bb:$PATH" busybox sh tests/build-test.sh
      - name: busybox ash - release tests
        timeout-minutes: 10
        run: PATH="$RUNNER_TEMP/shim-bb:$PATH" busybox sh tests/release-test.sh
      - name: Tag matches module version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(tr -d '\r' < module/module.prop | sed -n 's/^version=//p')
          [ "$ver" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match module.prop version $ver"; exit 1; }

      - name: Build zip
        run: sh build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Kprofiles-Control
          path: |
            dist/*.zip
            dist/update.json
            dist/changelog.md
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # See release.sh: draft first, never public without update.json, refuses a versionCode that
        # does not go up, never lets a re-run of an older tag become "latest", and checks afterwards
        # that latest/download/update.json and the zip and changelog it points to really resolve.
        run: sh release.sh "$GITHUB_REF_NAME"
